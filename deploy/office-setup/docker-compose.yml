# TaskView — office / team setup (password auth, self-hosted)
# Usage: copy .env.*.example → .env.*, then run start.ps1 or start.sh

networks:
  backend:

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./.env.postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [backend]

  migration:
    image: gimanhead/taskview-ce-db-migration:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.taskview
    networks: [backend]

  taskview-api-server:
    image: gimanhead/taskview-ce-api-server:latest
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-1725}:1401"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - ./.env.taskview
    networks: [backend]

  taskview-ce-webapp:
    image: gimanhead/taskview-ce-webapp:latest
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8888}:80"
    environment:
      TASKVIEW_API_URL: "http://localhost:${API_HOST_PORT:-1725}"
    depends_on:
      - taskview-api-server
    networks: [backend]

volumes:
  pgdata:
